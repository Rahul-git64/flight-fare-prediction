name: CI

on:
  push:
    branches: ["main", "feat/**", "ci/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run unit and API integration tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production container image
        run: docker build -t app:ci .

      - name: Smoke-test container health and prediction
        run: |
          docker run -d --name flight-api -p 8000:8000 app:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"airline":"Vistara","source_city":"Delhi","departure_time":"Morning","stops":"zero","arrival_time":"Afternoon","destination_city":"Mumbai","travel_class":"Economy","duration":2.15,"days_left":18}'
          curl -fsS http://127.0.0.1:8000/monitor/drift
          docker rm -f flight-api
