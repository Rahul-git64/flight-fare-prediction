project:
  name: flight-fare-prediction
  version: "0.1.0"

data:
  raw_data_path: "artifacts/data/raw_flights.csv"
  train_data_path: "artifacts/data/train_flights.csv"
  test_data_path: "artifacts/data/test_flights.csv"
  test_size: 0.2
  random_state: 42
  synthetic_rows: 1500

features:
  target_column: "price"
  numerical_columns:
    - "duration"
    - "days_left"
  categorical_columns:
    - "airline"
    - "source_city"
    - "departure_time"
    - "stops"
    - "arrival_time"
    - "destination_city"
    - "travel_class"
  categories:
    airline:
      - "SpiceJet"
      - "AirAsia"
      - "Vistara"
      - "GO_FIRST"
      - "Indigo"
      - "Air_India"
    source_city:
      - "Delhi"
      - "Mumbai"
      - "Bangalore"
      - "Kolkata"
      - "Hyderabad"
      - "Chennai"
    departure_time:
      - "Early_Morning"
      - "Morning"
      - "Afternoon"
      - "Evening"
      - "Night"
      - "Late_Night"
    stops:
      - "zero"
      - "one"
      - "two_or_more"
    arrival_time:
      - "Early_Morning"
      - "Morning"
      - "Afternoon"
      - "Evening"
      - "Night"
      - "Late_Night"
    destination_city:
      - "Mumbai"
      - "Bangalore"
      - "Kolkata"
      - "Hyderabad"
      - "Chennai"
      - "Delhi"
    travel_class:
      - "Economy"
      - "Business"

model:
  artifacts_dir: "artifacts/models"
  preprocessor_filename: "preprocessor.joblib"
  model_filename: "model.joblib"
  metadata_filename: "metadata.json"
  reference_stats_filename: "reference_stats.json"
  r2_threshold: 0.75

monitoring:
  window_size: 200
  ks_alpha: 0.05
  psi_threshold: 0.25
  categorical_l1_threshold: 0.30
